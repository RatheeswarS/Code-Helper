---
# roles/prerequisites/tasks/main.yml
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Git
  ansible.builtin.apt:
    name: git
    state: present

- name: Check Git version
  ansible.builtin.command: git --version
  register: git_ver
  changed_when: false

- name: Show Git version
  ansible.builtin.debug:
    msg: "{{ git_ver.stdout }}"
